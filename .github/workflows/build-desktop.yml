name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - duration-uniform-scheduling

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows-x64
          - os: macos-latest
            artifact_suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare static files
        shell: bash
        run: |
          mkdir -p backend/static
          cp -R frontend/dist/. backend/static/

      - name: Install backend dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Package PlanAgent
        run: |
          python -m PyInstaller planagent.spec --noconfirm

      - name: Sign macOS binary (optional)
        if: runner.os == 'macOS' && env.AC_CERTIFICATE_BASE64 != ''
        env:
          AC_CERTIFICATE_BASE64: ${{ secrets.AC_CERTIFICATE_BASE64 }}
          AC_P12_PASSWORD: ${{ secrets.AC_P12_PASSWORD }}
          APPLE_CERT_NAME: ${{ secrets.APPLE_CERT_NAME }}
          KEYCHAIN_NAME: planagent-signing
        run: |
          echo "$AC_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$AC_P12_PASSWORD" "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$AC_P12_PASSWORD" "$KEYCHAIN_NAME"
          security import /tmp/cert.p12 -P "$AC_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_NAME"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$AC_P12_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME"
          codesign --force --options runtime --timestamp --deep -s "$APPLE_CERT_NAME" dist/PlanAgent

      - name: Sign Windows executable (optional)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.AZURE_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_CERT_PROFILE }}
          files: dist\PlanAgent.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Assemble release folder
        shell: bash
        run: |
          dest="release/planagent-${{ matrix.artifact_suffix }}"
          mkdir -p "$dest"
          cp dist/PlanAgent* "$dest/"
          cp planagent.conf.example "$dest/planagent.conf"
          cat > "$dest/使用说明.txt" <<'EOF'
          PlanAgent 本地版使用说明

          1. 把 PlanAgent（Windows 为 PlanAgent.exe）和 planagent.conf 放在同一个文件夹。
          2. 用文本编辑器打开 planagent.conf，在 PLANAGENT_LLM_API_KEY= 后面填上你自己的
             DeepSeek API Key（到 https://platform.deepseek.com 获取），保存。
          3. 双击运行。macOS 若提示无法验证开发者：右键点击 → 打开，或在终端执行
             xattr -dr com.apple.quarantine PlanAgent
          4. 你的数据保存在同目录的 planagent.db；想备份直接复制这个文件即可。
          EOF

      - name: Self-sign Windows executable (optional)
        if: runner.os == 'Windows' && env.WINDOWS_PFX_BASE64 != '' && env.WINDOWS_PFX_PASSWORD != ''
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\code-sign.pfx", [System.Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$env:RUNNER_TEMP\code-sign.pfx", $env:WINDOWS_PFX_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('My', 'CurrentUser')
          $store.Open('ReadWrite')
          $store.Add($cert)
          $store.Close()
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          Get-ChildItem -Path dist -Filter 'PlanAgent*' | ForEach-Object {
            & $signtool.FullName sign /f "$env:RUNNER_TEMP\code-sign.pfx" /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Zip release
        shell: bash
        run: |
          cd release
          python -m zipfile -c "PlanAgent-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip" "planagent-${{ matrix.artifact_suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: PlanAgent-${{ matrix.artifact_suffix }}
          path: release/PlanAgent-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
